<!DOCTYPE html><html lang="pt-BR"><head>
  <script src="../../cdn.utmify.com.br/scripts/utms/latest_v%3D999993.js" data-utmify-prevent-xcod-sck="" data-utmify-prevent-subids="" async="" defer=""></script>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <title>TikTok Recompensas</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 448 512'><path fill='%23000000' d='M448 209.91a210.06 210.06 0 0 1-122.77-39.25V349.38A162.55 162.55 0 1 1 185 188.31v89.89a74.62 74.62 0 1 0 52.23 71.18V0l88 0a121.18 121.18 0 0 0 1.86 22.17h0A122.18 122.18 0 0 0 381 102.39a121.43 121.43 0 0 0 67 20.14Z'/></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --tt-red: #FE2C55;
      --tt-red-2: #FF0050;
      --ink: #111111;
      --muted: #8a94a6;
      --field-border: #e4e8ef;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: #ffffff;
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--ink);
      min-height: 100%;
    }

    .page {
      max-width: 620px;
      margin: 0 auto;
      padding: 0 16px 60px;
    }

    /* Top brand bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 22px 0 20px;
      border-bottom: 1px solid #eef1f5;
    }

    .topbar svg { display: block; }

    .topbar .wordmark {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--ink);
    }

    /* Promo card */
    .promo {
      margin: 40px auto 0;
      max-width: 340px;
      background: linear-gradient(150deg, #C13BF0 0%, #9B2FE0 55%, #8A1FD6 100%);
      border-radius: 22px;
      padding: 22px 20px 24px;
      box-shadow: 0 24px 60px rgba(139, 31, 214, 0.28);
    }

    .promo .pill {
      display: inline-block;
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 999px;
      margin-bottom: 16px;
    }

    .promo h1 {
      color: #ffffff;
      font-size: 29px;
      line-height: 1.18;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .promo h1 .amount { color: #FFE24B; }

    /* White capture box */
    .capture {
      background: #ffffff;
      border-radius: 12px;
      padding: 18px 16px 16px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
    }

    .capture .label {
      font-size: 15px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 12px;
    }

    .capture input {
      width: 100%;
      font-family: inherit;
      font-size: 15px;
      color: var(--ink);
      padding: 14px 14px;
      border: 1px solid var(--field-border);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .capture input::placeholder { color: #9aa3b2; }

    .capture input:focus {
      border-color: var(--tt-red);
      box-shadow: 0 0 0 3px rgba(254, 44, 85, 0.12);
    }

    .capture .error {
      display: none;
      color: var(--tt-red);
      font-size: 12.5px;
      font-weight: 500;
      margin-top: 7px;
    }

    .capture.invalid .error { display: block; }
    .capture.invalid input { border-color: var(--tt-red); }

    .capture button {
      width: 100%;
      margin-top: 12px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(135deg, var(--tt-red), var(--tt-red-2));
      border: none;
      border-radius: 8px;
      padding: 15px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(254, 44, 85, 0.3);
      transition: transform 0.12s, opacity 0.15s;
    }

    .capture button:hover { opacity: 0.96; }
    .capture button:active { transform: translateY(1px); }

    /* Footer terms */
    .terms {
      max-width: 340px;
      margin: 34px auto 0;
      padding-top: 26px;
      border-top: 1px solid #eef1f5;
      text-align: center;
      font-size: 12.5px;
      font-weight: 600;
      line-height: 1.55;
      color: var(--muted);
    }

    .terms a { color: var(--muted); text-decoration: underline; }

    @media (max-width: 380px) {
      .promo h1 { font-size: 26px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <!-- Brand bar -->
    <div class="topbar">
      <svg width="30" height="30" viewBox="0 0 448 512" aria-hidden="true">
        <path fill="#FE2C55" d="M448 209.91a210.06 210.06 0 0 1-122.77-39.25V349.38A162.55 162.55 0 1 1 185 188.31v89.89a74.62 74.62 0 1 0 52.23 71.18V0l88 0a121.18 121.18 0 0 0 1.86 22.17h0A122.18 122.18 0 0 0 381 102.39a121.43 121.43 0 0 0 67 20.14Z" opacity="0.9"></path>
        <path fill="#111111" d="M420 181.91a210.06 210.06 0 0 1-122.77-39.25V321.38A162.55 162.55 0 1 1 157 160.31v89.89a74.62 74.62 0 1 0 52.23 71.18V0l88 0a121.18 121.18 0 0 0 1.86 22.17h0A122.18 122.18 0 0 0 353 74.39a121.43 121.43 0 0 0 67 20.14Z" transform="translate(-16 14) scale(0.94)"></path>
      </svg>
      <span class="wordmark">TikTok</span>
    </div>

    <!-- Promo card -->
    <div class="promo">
      <span class="pill">01 de jan - 01 de dez</span>
      <h1>Conclua nossa pesquisa e ganhe até <span class="amount">R$597</span> em recompensas</h1>

      <form id="capture" class="capture" novalidate="">
        <div class="label">Insira o seu e-mail para acessar</div>
        <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="Digite o seu e-mail" aria-label="E-mail">
        <div class="error">Digite um e-mail válido para continuar.</div>
        <button type="submit">Acessar</button>
      </form>
    </div>

    <!-- Terms -->
    <p class="terms">
      Ao participar das atividades de recompensa, você concorda com nossos <a href="#">Termos e Condições</a>.
    </p>
  </div>

  <script>
    (function () {
      var form = document.getElementById('capture');
      var input = document.getElementById('email');

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var email = input.value.trim();

        // Guarda o que foi digitado para uso no quiz / checkout
        try { localStorage.setItem('user_email', email); } catch (err) {}

        // Redireciona para o quiz, preservando os parâmetros de rastreamento (UTMs)
        var dest = 'quiz/index.html';
        var qs = window.location.search.replace('?', '');
        if (qs) { dest += '?' + qs; }
        window.location.href = dest;
      });
    })();
  </script>



</body></html>
