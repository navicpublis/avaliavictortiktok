<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok — Conclua nossa pesquisa e ganhe até R$850</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: #010101;
    }

    .vsl-shadow {
      box-shadow: 0 0 50px -12px rgba(254, 44, 85, 0.3);
    }

    .btn-pulse {
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(254, 44, 85, 0.7); }
      70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(254, 44, 85, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(254, 44, 85, 0); }
    }
  </style>
</head>
<body class="text-white min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-4xl flex flex-col items-center gap-8">
    
    <!-- Header Section -->
    <div class="text-center space-y-3">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-zinc-900 border border-zinc-800 text-zinc-400 text-xs font-medium mb-2">
        <i data-lucide="shield-check" class="w-3 h-3 text-green-500"></i>
        Pesquisa Oficial TikTok 2026
      </div>
      <h1 class="text-2xl md:text-4xl font-bold tracking-tight text-zinc-100">
        Assista ao vídeo para <span class="text-[#fe2c55]">continuar</span>
      </h1>
      <p class="text-zinc-500 text-sm md:text-base max-w-lg mx-auto">
        Siga as instruções do vídeo para validar sua participação e liberar o resgate do valor.
      </p>
    </div>

    <!-- Video Player Container -->
    <div class="relative w-full max-w-sm aspect-[9/16] rounded-2xl overflow-hidden vsl-shadow border border-zinc-800 bg-zinc-900 mx-auto">
      <video 
        id="vsl" 
        class="w-full h-full object-cover" 
        controls 
        playsinline 
        preload="metadata"
      >
        <source src="vsl.mp4" type="video/mp4">
        Seu navegador não suporta vídeos.
      </video>
    </div>

    <!-- Dynamic CTA Section -->
    <div id="cta-container" class="w-full max-w-md">
      <a href="https://ambieenteseguro.site/f/hnpfyw4yzw" 
         class="btn-pulse flex items-center justify-center gap-3 w-full py-5 px-8 bg-[#fe2c55] hover:bg-[#e0264d] text-white font-bold text-xl rounded-2xl transition-all duration-200 shadow-lg">
        LIBERAR MEU PAGAMENTO AGORA
        <i data-lucide="arrow-right" class="w-6 h-6"></i>
      </a>
      <p class="text-center text-zinc-600 text-xs mt-4 flex items-center justify-center gap-1">
        <i data-lucide="lock" class="w-3 h-3"></i>
        Conexão segura e criptografada
      </p>
    </div>

  </div>

  <script>
    // Initialize Lucide Icons
    lucide.createIcons();

    const video = document.getElementById('vsl');
    const cta = document.getElementById('cta-container');

    // Show CTA when video ends
    video.onended = function() {
      cta.classList.remove('hidden');
      cta.classList.add('block');
      
      // Smooth scroll to CTA
      cta.scrollIntoView({ behavior: 'smooth', block: 'center' });
    };
  </script>

</body>
</html>
